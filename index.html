let month=0;const cal=document.getElementById('calendar');function inside(day,ranges){return ranges.some(([a,b])=>day>=a&&day<=b)}function render(){document.getElementById('month').textContent=months[month]+' 2027';document.getElementById('prev').disabled=month===0;document.getElementById('next').disabled=month===11;cal.replaceChildren();for(const name of ['S','M','T','W','T','F','S']){const e=document.createElement('div');e.className='weekday';e.textContent=name;cal.append(e)}const offset=new Date(Date.UTC(2027,month,1)).getUTCDay();const count=new Date(Date.UTC(2027,month+1,0)).getUTCDate();for(let i=0;i<Math.ceil((offset+count)/7)*7;i++){const n=i-offset+1;const el=document.createElement('div');el.className='day';if(n<1||n>count)el.classList.add('empty');else{const date='2027-'+String(month+1).padStart(2,'0')+'-'+String(n).padStart(2,'0');el.textContent=n;const status=inside(date,booked)?'booked':inside(date,peak)?'peak':'available';el.classList.add(status);el.setAttribute('aria-label',months[month]+' '+n+', '+(status==='peak'?'holiday rate':status))}cal.append(el)}}document.getElementById('prev').addEventListener('click',()=>{if(month>0){month--;render()}});document.getElementById('next').addEventListener('click',()=>{if(month<11){month++;render()}});render();
</script></body></html>
